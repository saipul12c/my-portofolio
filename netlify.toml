[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/saipul"
  to = "/.netlify/functions/saipul"
  status = 200

[[redirects]]
  from = "/api/saipul/"
  to = "/.netlify/functions/saipul"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
